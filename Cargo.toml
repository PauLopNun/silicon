[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
silicon-hdl = { path = "crates/hdl" }
silicon-sim-gate = { path = "crates/sim-gate" }
silicon-sim-fast = { path = "crates/sim-fast" }
silicon-machine = { path = "crates/machine" }
silicon-asm = { path = "crates/asm" }
silicon-cc = { path = "crates/cc" }
proptest = "1"
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
