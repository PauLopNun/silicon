<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Silicon</title>
    <style>
      :root { --bg: #05070c; --ink: #c9d6e8; --dim: #5d6b82; --hot: #ffb347; --line: #1a2233; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
        font: 14px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; gap: 12px;
        align-items: center; flex-wrap: wrap; pointer-events: none; }
      #hud > * { pointer-events: auto; }
      h1 { font-size: 14px; letter-spacing: .3em; margin: 0; font-weight: 600; }
      #crumbs { color: var(--dim); }
      #engine { margin-left: auto; padding: 2px 10px; border: 1px solid var(--hot); color: var(--hot);
        border-radius: 999px; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; }
      #panel { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      button { font: inherit; color: var(--ink); background: #0c111b; border: 1px solid var(--line);
        border-radius: 6px; padding: 8px 14px; cursor: pointer; min-width: 72px; }
      button[aria-pressed="true"] { border-color: var(--hot); color: var(--hot); box-shadow: 0 0 12px #ffb34755; }
      button:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }
      #status { color: var(--dim); }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="3D view of the circuit"></canvas>
    <div id="hud">
      <h1>SILICON</h1>
      <span id="crumbs"></span>
      <span id="engine" title="Engine currently driving what you see">…</span>
    </div>
    <div id="panel">
      <button id="in-a" aria-pressed="false">A = 0</button>
      <button id="in-b" aria-pressed="false">B = 0</button>
      <span id="status" role="status">starting simulation…</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
